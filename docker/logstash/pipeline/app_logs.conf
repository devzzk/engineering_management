# ============================================================
# Logstash Pipeline: Laravel 运行日志 -> Elasticsearch
# ============================================================
# 日志源：storage/logs/laravel-*.log 和 storage/logs/api/api-*.log
# 需在 docker-compose.yml 中为 logstash 服务添加 volume：
#   - './storage/logs:/usr/share/logstash/app_logs'
# ============================================================

input {
  # ========== Laravel 通用应用日志 ==========
  file {
    path => "/usr/share/logstash/app_logs/laravel-*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/pipeline/.metadata/app_log_sincedb"
    sincedb_write_interval => 15
    stat_interval => 5
    discover_interval => 10
    close_older => "1 hour"
    ignore_older => "24 hours"
    type => "app_log"
    tags => ["logs", "app"]
  }

  # ========== API 审计日志 ==========
  file {
    path => "/usr/share/logstash/app_logs/api/api-*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/pipeline/.metadata/api_log_sincedb"
    sincedb_write_interval => 15
    stat_interval => 5
    discover_interval => 10
    close_older => "1 hour"
    ignore_older => "24 hours"
    type => "api_log"
    tags => ["logs", "api"]
  }
}

# ============================================================
# Filter: 日志解析与字段提取
# ============================================================
filter {
  # ---------- 解析 Laravel 日志行格式 ----------
  # 格式: [2024-01-01 12:00:00] local.ERROR: 一些消息 {"key":"value"}
  if "logs" in [tags] {
    grok {
      match => {
        "message" => [
          "^\[%{TIMESTAMP_ISO8601:log_timestamp}\]\s+%{WORD:laravel_env}\.%{LOGLEVEL:log_level}:\s+%{DATA:log_message}(\s+\{%{GREEDYDATA:context_raw}\})?$",
          "^\[%{TIMESTAMP_ISO8601:log_timestamp}\]\s+%{WORD:laravel_env}\.%{LOGLEVEL:log_level}:\s+%{GREEDYDATA:log_message}$"
        ]
      }
      tag_on_failure => ["_grok_parse_failure"]
    }

    # ---------- 设置 @timestamp 为日志时间 ----------
    if [log_timestamp] {
      date {
        match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss"]
        target => "@timestamp"
        timezone => "Asia/Shanghai"
      }
    }

    # ---------- 尝试解析日志中的 JSON 上下文 ----------
    if [context_raw] {
      json {
        source => "context_raw"
        target => "context"
        remove_field => ["context_raw"]
        skip_on_invalid_json => true
      }
    }
  }

  # ---------- API 日志专用处理 ----------
  if [type] == "api_log" {
    mutate { add_field => { "[@metadata][es_index_prefix]" => "api_logs" } }

    # API 日志的 JSON 上下文即为主体数据，提升到顶层
    if [context] {
      # 将 context 中的关键字段提升为顶层字段，便于 Kibana 搜索/聚合
      mutate {
        copy => {
          "[context][request_id]" => "[request_id]"
          "[context][method]" => "[http_method]"
          "[context][path]" => "[http_path]"
          "[context][status_code]" => "[http_status]"
          "[context][duration_ms]" => "[duration_ms]"
          "[context][user_id]" => "[user_id]"
          "[context][ip]" => "[client_ip]"
          "[context][outcome]" => "[outcome]"
          "[context][exception][class]" => "[exception_class]"
          "[context][exception][message]" => "[exception_message]"
        }
      }
    }
  } else if [type] == "app_log" {
    mutate { add_field => { "[@metadata][es_index_prefix]" => "app_logs" } }
  }

  # ---------- 通用字段清理 ----------
  if "logs" in [tags] {
    mutate {
      # 移除不需要的元数据字段，减小文档体积
      remove_field => ["message", "host", "path", "tags", "@version"]
    }
  }
}

# ============================================================
# Output: Elasticsearch（按天分索引）
# ============================================================
output {
  if "logs" in [tags] {
    # 调试输出（开发阶段可用，生产环境建议注释）
    # stdout {
    #   codec => rubydebug { metadata => true }
    # }

    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "%{[@metadata][es_index_prefix]}-%{+YYYY.MM.DD}"
      user => "elastic"
      password => "123456"
      ssl_enabled => false
      # 按天自动创建索引
      manage_template => true
      template_name => "laravel_logs"
      template_overwrite => true
      template => "/usr/share/logstash/pipeline/logs_template.json"
    }
  }
}
