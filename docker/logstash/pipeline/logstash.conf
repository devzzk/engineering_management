# ============================================================
# Filter: 按 type 设置目标 ES 索引和处理逻辑
# ============================================================
filter {
  # ---------- 设置目标 ES 索引 ----------
  if [type] == "users" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_users" } }
    mutate {
      remove_field => ["password", "two_factor_secret", "two_factor_recovery_codes", "remember_token"]
    }
  }
  else if [type] == "tenants" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_tenants" } }
    mutate {
      convert => { "meta" => "string" }
    }
  }
  else if [type] == "tenant_members" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_tenant_members" } }
  }
  else if [type] == "plans" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_plans" } }
    mutate { convert => { "is_public" => "boolean" } }
  }
  else if [type] == "subscriptions" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_subscriptions" } }
    mutate {
      convert => { "cancel_at_period_end" => "boolean" }
      convert => { "price_amount" => "float" }
    }
  }
  else if [type] == "orders" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_orders" } }
    mutate {
      convert => {
        "total_amount" => "float"
        "discount_amount" => "float"
        "paid_amount" => "float"
      }
    }
  }
  else if [type] == "invoices" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_invoices" } }
    mutate {
      convert => {
        "amount" => "float"
        "tax_amount" => "float"
        "total_amount" => "float"
      }
    }
  }
  else if [type] == "payments" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_payments" } }
    mutate { convert => { "amount" => "float" } }
  }
  else if [type] == "support_tickets" {
    mutate { add_field => { "[@metadata][es_index]" => "saas_support_tickets" } }
  }

  # ---------- 通用字段处理 ----------
  mutate {
    # 将 id 设为 ES 文档 _id
    copy => { "id" => "[@metadata][_id]" }

    # 类型转换（ES 日期格式）
    convert => {
      "id" => "integer"
      "tenant_id" => "integer"
      "user_id" => "integer"
      "created_at" => "string"
      "updated_at" => "string"
    }
  }

  # 移除 JDBC 元数据字段
  mutate {
    remove_field => ["@version"]
  }
}

# ============================================================
# Output: Elasticsearch
# ============================================================
output {
  # 调试输出（开发阶段可用，生产环境建议注释）
  # stdout {
  #   codec => rubydebug { metadata => true }
  # }

  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][es_index]}"
    document_id => "%{[@metadata][_id]}"
    action => "update"
    doc_as_upsert => true
    manage_template => false
    user => "elastic"
    password => "123456"
    ssl_enabled => false
  }
}
